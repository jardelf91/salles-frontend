<div class="modal-background">
  <div class="modal-container">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <img src="assets/imagem/Internapp-icon.svg" />
        </div>
        <div class="label-recovery">Recuperação de Senha</div>
      </div>
      <label class="email-label" for="email">Endereço de Email:</label>
      <input
        type="email"
        id="email"
        class="email-input"
        placeholder="Digite seu email"
      />
      <div class="button-container">
        <button class="back-button" (click)="closeModal.emit()" >Voltar</button>
        <button class="submit-button">Solicitar recuperação</button>
      </div>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
